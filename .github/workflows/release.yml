# Pushing a version tag (v1.2.3) builds the Windows installer and publishes it as a
# GitHub Release. Installed apps pick it up from there (electron-updater reads latest.yml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package.json version
        run: node scripts/check-version.js "$GITHUB_REF"

      - name: Tests
        run: npm test

      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
