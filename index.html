<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">

<title>Private Workspace</title>
<style>
  :root {
    --bg: #14141a; --bar: #1c1c24; --line: #2a2a34; --text: #ecebf0; --muted: #9a9aa6;
    --accent: #6ee7b7; --accent-dim: #134e39; --danger: #f87171; --chip: #24242e; --focus: #818cf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }

  /* status strip */
  .status { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--bar);
            border-bottom: 1px solid var(--line); flex: none; }
  .shield { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .shield .dot { width: 9px; height: 9px; border-radius: 50%; }
  .on  .dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .off .dot { background: var(--danger); box-shadow: 0 0 0 4px #4c1d1d; }
  .off { color: var(--danger); }
  .status .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }
  .hint kbd { font: 11px Consolas, monospace; background: var(--chip); border: 1px solid var(--line);
              border-radius: 4px; padding: 0 5px; color: var(--text); }
  button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--focus); }
  button.primary { background: var(--accent-dim); border-color: transparent; }

  /* tabs */
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--bar); flex: none; }
  .tab { padding: 8px 16px; border: 1px solid var(--line); border-bottom: none;
         border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--line); }

  .panel { flex: 1; display: none; min-height: 0; }
  .panel.active { display: flex; flex-direction: column; }

  /* browser */
  .nav { display: flex; gap: 6px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
  .nav button { padding: 6px 10px; }
  .nav input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
               color: var(--text); padding: 6px 12px; outline: none; }
  .nav input:focus { border-color: var(--focus); }
  webview { flex: 1; border: 0; background: #fff; }
  .shortcuts { padding: 10px 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line);
               display: flex; gap: 8px; flex-wrap: wrap; background: var(--bar); flex: none; }
  .shortcuts a { color: var(--accent); text-decoration: none; background: var(--chip); padding: 3px 10px; border-radius: 999px; }
  .shortcuts a:hover { text-decoration: underline; }

  /* notes */
  .notes-wrap { flex: 1; display: flex; min-height: 0; }
  .notes-side { width: 230px; flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px;
                background: var(--bar); border-right: 1px solid var(--line); min-height: 0; }
  .notes-side input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
                      padding: 6px 10px; outline: none; font: inherit; }
  .notes-side input:focus { border-color: var(--focus); }
  #notes-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .note-item { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; display: block; }
  .note-item:hover { background: var(--chip); border: 0; }
  .note-item.active { background: var(--chip); box-shadow: inset 2px 0 0 var(--accent); }
  .note-item .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-item .w { display: block; color: var(--muted); font-size: 11px; }
  .notes-empty { color: var(--muted); font-size: 12px; padding: 6px 8px; }
  .notes-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .notes-tools { display: flex; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .notes-tools .spacer { flex: 1; }
  .notes-tools button { padding: 4px 10px; font-size: 13px; }
  .notes-tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .notes-tools .danger:hover { border-color: var(--danger); color: var(--danger); }
  .notes-edit { flex: 1; display: flex; min-height: 0; }
  #notes { flex: 1; width: 100%; resize: none; border: 0; outline: none; background: var(--bg); min-width: 0;
           color: var(--text); padding: 20px; font: 15px/1.7 "Segoe UI", system-ui, sans-serif; }
  #notes-preview { flex: 1; overflow-y: auto; padding: 20px; border-left: 1px solid var(--line); min-width: 0; line-height: 1.7; }
  #notes-preview[hidden] { display: none; }
  #notes-preview h1, #notes-preview h2, #notes-preview h3 { margin: 0 0 8px; line-height: 1.3; }
  #notes-preview p, #notes-preview ul, #notes-preview ol, #notes-preview blockquote, #notes-preview pre { margin: 0 0 12px; }
  #notes-preview code { font: 13px Consolas, monospace; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  #notes-preview pre { background: #0b0b0f; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  #notes-preview pre code { background: none; padding: 0; }
  #notes-preview blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
  .notes-foot { padding: 6px 12px; color: var(--muted); font-size: 12px; background: var(--bar); border-top: 1px solid var(--line); flex: none; }

  .banner { padding: 8px 12px; font-size: 13px; background: #3b1d1d; color: #fecaca; display: none; }
  .banner.show { display: block; }
  .notice { padding: 8px 12px; font-size: 13px; background: #1e293b; color: #cbd5e1; display: none; }
  .notice.show { display: block; }
</style>
</head>
<body>
  <div class="status" id="shield-wrap">
    <span class="shield on" id="shield"><span class="dot"></span><span id="shield-text">Hidden from screen capture</span></span>
    <span class="spacer"></span>
    <span class="hint"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> hides everything</span>
    <button id="toggle">Turn off</button>
  </div>
  <div class="banner" id="banner">
    Protection is <b>OFF</b> — this window's contents are now visible to screenshots and screen sharing.
  </div>

  <div class="notice" id="notice" role="status"></div>

  <div class="tabs">
    <button class="tab active" data-panel="browser">Browser</button>
    <button class="tab" data-panel="notes">Notes</button>
  </div>

  <!-- Browser -->
  <div class="panel active" id="panel-browser">
    <div class="nav">
      <button id="back" title="Back">←</button>
      <button id="fwd" title="Forward">→</button>
      <button id="reload" title="Reload">⟳</button>
      <input id="url" placeholder="Search or enter address" spellcheck="false">
      <button id="go" class="primary">Go</button>
    </div>
    <webview id="wv" src="https://duckduckgo.com" partition="persist:private" allowpopups></webview>
    <div class="shortcuts">
      <span>Quick open:</span>
      <a href="#" data-url="https://mail.google.com">Gmail</a>
      <a href="#" data-url="https://outlook.live.com">Outlook</a>
      <a href="#" data-url="https://web.whatsapp.com">WhatsApp</a>
      <a href="#" data-url="https://drive.google.com">Drive</a>
      <a href="#" data-url="https://duckduckgo.com">Search</a>
    </div>
  </div>

  <!-- Notes -->
  <div class="panel" id="panel-notes">
    <div class="notes-wrap">
      <aside class="notes-side">
        <input id="notes-search" type="search" placeholder="Search notes" spellcheck="false">
        <button id="notes-new">＋ New note</button>
        <ul id="notes-list"></ul>
      </aside>
      <section class="notes-main">
        <div class="notes-tools">
          <span class="spacer"></span>
          <button id="notes-preview-toggle" aria-pressed="false" title="Show the Markdown preview">Preview</button>
          <button id="notes-delete" class="danger">Delete</button>
        </div>
        <div class="notes-edit">
          <textarea id="notes" placeholder="Private notes — encrypted on this device, and hidden from screen capture.&#10;&#10;Markdown works: # heading, **bold**, *italic*, - list, `code`"></textarea>
          <div id="notes-preview" hidden></div>
        </div>
        <div class="notes-foot" id="notes-status">Opening notes…</div>
      </section>
    </div>
  </div>

<script src="renderer/notes-model.js"></script>
<script src="renderer/markdown.js"></script>
<script src="renderer/notes-ui.js"></script>
<script src="renderer/app.js"></script>
</body>
</html>
