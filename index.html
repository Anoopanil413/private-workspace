<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">

<title>Private Workspace</title>
<style>
  :root {
    --bg: #14141a; --bar: #1c1c24; --line: #2a2a34; --text: #ecebf0; --muted: #9a9aa6;
    --accent: #6ee7b7; --accent-dim: #134e39; --danger: #f87171; --chip: #24242e; --focus: #818cf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }

  /* status strip */
  .status { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--bar);
            border-bottom: 1px solid var(--line); flex: none; }
  .shield { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .shield .dot { width: 9px; height: 9px; border-radius: 50%; }
  .on  .dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .off .dot { background: var(--danger); box-shadow: 0 0 0 4px #4c1d1d; }
  .off { color: var(--danger); }
  .status .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }
  .hint kbd { font: 11px Consolas, monospace; background: var(--chip); border: 1px solid var(--line);
              border-radius: 4px; padding: 0 5px; color: var(--text); }
  button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--focus); }
  button.primary { background: var(--accent-dim); border-color: transparent; }

  /* tabs */
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--bar); flex: none; }
  .tab { padding: 8px 16px; border: 1px solid var(--line); border-bottom: none;
         border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--line); }

  .panel { flex: 1; display: none; min-height: 0; }
  .panel.active { display: flex; flex-direction: column; }

  /* browser */
  .nav { display: flex; gap: 6px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
  .nav button { padding: 6px 10px; }
  .nav input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
               color: var(--text); padding: 6px 12px; outline: none; }
  .nav input:focus { border-color: var(--focus); }
  /* browser tabs */
  .btabs { display: flex; gap: 2px; align-items: flex-end; padding: 6px 12px 0; background: var(--bar); flex: none; overflow-x: auto; }
  .btab { display: flex; align-items: center; gap: 6px; max-width: 200px; min-width: 90px; padding: 5px 6px 5px 12px;
          border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; color: var(--muted); cursor: pointer; font-size: 13px; }
  .btab:hover { background: var(--chip); }
  .btab.active { background: var(--bg); border-color: var(--line); color: var(--text); }
  .btab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btab-x { border: 0; background: transparent; color: var(--muted); padding: 0 5px; border-radius: 4px; line-height: 1.4; }
  .btab-x:hover { background: var(--line); color: var(--text); border: 0; }
  .btab-add { border: 0; background: transparent; color: var(--muted); padding: 4px 10px; margin-bottom: 2px; }
  .btab-add:hover { background: var(--chip); border: 0; color: var(--text); }
  .webviews { flex: 1; position: relative; min-height: 0; background: #fff; }
  /* Inactive tabs stay laid out (a display:none webview can come back at 0x0). */
  .webviews webview { position: absolute; inset: 0; border: 0; visibility: hidden; }
  .webviews webview.active { visibility: visible; z-index: 1; }
  .findbar { position: absolute; top: 8px; right: 16px; z-index: 5; display: flex; gap: 6px; align-items: center;
             background: var(--bar); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px;
             box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .findbar[hidden] { display: none; }
  .findbar input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--text);
                   padding: 4px 8px; outline: none; font: inherit; width: 200px; }
  .findbar input:focus { border-color: var(--focus); }
  #find-count { color: var(--muted); font-size: 12px; min-width: 44px; text-align: right; }
  .findbar button { padding: 2px 8px; }
  #zoom-badge { font-size: 12px; padding: 4px 8px; }
  .shortcuts { padding: 10px 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line);
               display: flex; gap: 8px; flex-wrap: wrap; background: var(--bar); flex: none; }
  .shortcuts a { color: var(--accent); text-decoration: none; background: var(--chip); padding: 3px 10px; border-radius: 999px; }
  .shortcuts .chip { display: inline-flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 999px;
                     padding: 0 4px 0 10px; border: 1px solid transparent; cursor: grab; }
  .shortcuts .chip a { background: none; padding: 3px 0; }
  .shortcuts .chip.dragging { opacity: .4; }
  .shortcuts .chip.drop { border-color: var(--accent); }
  .shortcuts .chip-x { border: 0; background: transparent; color: var(--muted); padding: 0 5px; border-radius: 999px; font-size: 13px; }
  .shortcuts .chip-x:hover { color: var(--text); background: var(--line); border: 0; }
  .shortcuts .chip-hint { font-style: italic; }
  .shortcuts a:hover { text-decoration: underline; }
  #star[aria-pressed="true"] { color: var(--warn, #fbbf24); }
  #star:disabled { opacity: .4; cursor: default; }
  .nav { position: relative; }
  .ab-badge { display: inline-flex; gap: 4px; align-items: center; background: var(--accent-dim); color: var(--accent); border-color: transparent; }
  .ab-pop { position: absolute; right: 60px; top: calc(100% + 4px); z-index: 10; background: var(--bar); border: 1px solid var(--line);
            border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 13px; }
  .ab-pop .ab-sub { color: var(--muted); }
  .ab-pop .ab-toggle { display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer; }
  .ab-pop .ab-toggle input { accent-color: var(--accent); }

  /* notes */
  .notes-wrap { flex: 1; display: flex; min-height: 0; }
  .notes-side { width: 230px; flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px;
                background: var(--bar); border-right: 1px solid var(--line); min-height: 0; }
  .notes-side input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
                      padding: 6px 10px; outline: none; font: inherit; }
  .notes-side input:focus { border-color: var(--focus); }
  #notes-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .note-item { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; display: block; }
  .note-item:hover { background: var(--chip); border: 0; }
  .note-item.active { background: var(--chip); box-shadow: inset 2px 0 0 var(--accent); }
  .note-item .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-item .w { display: block; color: var(--muted); font-size: 11px; }
  .notes-empty { color: var(--muted); font-size: 12px; padding: 6px 8px; }
  .notes-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .notes-tools { display: flex; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .notes-tools .spacer { flex: 1; }
  .notes-tools button { padding: 4px 10px; font-size: 13px; }
  .notes-tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .notes-tools .danger:hover { border-color: var(--danger); color: var(--danger); }
  .notes-edit { flex: 1; display: flex; min-height: 0; }
  #notes { flex: 1; width: 100%; resize: none; border: 0; outline: none; background: var(--bg); min-width: 0;
           color: var(--text); padding: 20px; font: 15px/1.7 "Segoe UI", system-ui, sans-serif; }
  #notes-preview { flex: 1; overflow-y: auto; padding: 20px; border-left: 1px solid var(--line); min-width: 0; line-height: 1.7; }
  #notes-preview[hidden] { display: none; }
  #notes-preview h1, #notes-preview h2, #notes-preview h3 { margin: 0 0 8px; line-height: 1.3; }
  #notes-preview p, #notes-preview ul, #notes-preview ol, #notes-preview blockquote, #notes-preview pre { margin: 0 0 12px; }
  #notes-preview code { font: 13px Consolas, monospace; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  #notes-preview pre { background: #0b0b0f; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  #notes-preview pre code { background: none; padding: 0; }
  #notes-preview blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
  #notes-dialog { background: var(--bar); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
                  padding: 20px; width: min(420px, calc(100vw - 32px)); }
  #notes-dialog::backdrop { background: rgba(0, 0, 0, .55); }
  #notes-dialog h3 { margin: 0 0 4px; font-size: 16px; }
  #nd-sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  #nd-sub:empty { display: none; }
  #nd-kind { border: 0; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 6px; }
  #nd-kind label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
  #nd-kind input { accent-color: var(--accent); margin-top: 4px; }
  #nd-kind .warn { color: var(--danger); }
  .nd-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .nd-field input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
                    padding: 7px 10px; font: inherit; outline: none; }
  .nd-field input:focus { border-color: var(--focus); }
  #nd-error { color: var(--danger); font-size: 13px; margin: 0 0 10px; min-height: 1em; }
  .nd-actions { display: flex; justify-content: flex-end; gap: 8px; }
  [hidden] { display: none !important; }
  .notes-foot { padding: 6px 12px; color: var(--muted); font-size: 12px; background: var(--bar); border-top: 1px solid var(--line); flex: none; }

  .banner { padding: 8px 12px; font-size: 13px; background: #3b1d1d; color: #fecaca; display: none; }
  .banner.show { display: block; }
  .notice { font-size: 13px; background: #1e293b; color: #cbd5e1; display: none; }
  .notice.show { display: block; }
  .notice-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 12px; }
  .notice-row + .notice-row { border-top: 1px solid #2c3a52; }
  .notice-row span { flex: 1; }
  .notice-row.sticky { background: #3b1d1d; color: #fecaca; }
  .notice-x { border: 0; background: transparent; color: inherit; padding: 0 6px; opacity: .7; }
  .notice-x:hover { opacity: 1; border: 0; }
</style>
</head>
<body>
  <div class="status" id="shield-wrap">
    <span class="shield on" id="shield"><span class="dot"></span><span id="shield-text">Hidden from screen capture</span></span>
    <span class="spacer"></span>
    <span class="hint"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> hides everything</span>
    <button id="toggle">Turn off</button>
  </div>
  <div class="banner" id="banner">
    Protection is <b>OFF</b> — this window's contents are now visible to screenshots and screen sharing.
  </div>

  <div class="notice" id="notice" role="status"></div>

  <div class="tabs">
    <button class="tab active" data-panel="browser">Browser</button>
    <button class="tab" data-panel="notes">Notes</button>
  </div>

  <!-- Browser -->
  <div class="panel active" id="panel-browser">
    <div class="btabs" id="browser-tabs" role="tablist"></div>
    <div class="nav">
      <button id="back" title="Back (Alt+Left)">←</button>
      <button id="fwd" title="Forward (Alt+Right)">→</button>
      <button id="reload" title="Reload (Ctrl+R)">⟳</button>
      <input id="url" placeholder="Search or enter address" spellcheck="false">
      <button id="ab-badge" class="ab-badge" aria-haspopup="true" aria-expanded="false">🛡 <span id="ab-count">0</span></button>
      <div id="ab-pop" class="ab-pop" role="dialog" aria-label="Ad blocking" hidden></div>
      <button id="zoom-badge" title="Reset zoom (Ctrl+0)" hidden>100%</button>
      <button id="star" title="Add this page to quick open" aria-pressed="false">☆</button>
      <button id="go" class="primary">Go</button>
    </div>
    <div class="webviews" id="webviews">
      <div class="findbar" id="findbar" role="search" hidden>
        <input id="find-input" placeholder="Find in page" spellcheck="false" aria-label="Find in page">
        <span id="find-count"></span>
        <button id="find-prev" title="Previous (Shift+Enter)">↑</button>
        <button id="find-next" title="Next (Enter)">↓</button>
        <button id="find-close" title="Close (Esc)">×</button>
      </div>
    </div>
    <div class="shortcuts" id="bookmarks"></div>
  </div>

  <!-- Notes -->
  <div class="panel" id="panel-notes">
    <div class="notes-wrap">
      <aside class="notes-side">
        <input id="notes-search" type="search" placeholder="Search notes" spellcheck="false">
        <button id="notes-new">＋ New note</button>
        <ul id="notes-list"></ul>
      </aside>
      <section class="notes-main">
        <div class="notes-tools">
          <button id="notes-import" title="Add notes from a .pwnotes, .txt or .md file">Import…</button>
          <button id="notes-export" title="Save all notes to Downloads\Private Workspace">Export…</button>
          <span class="spacer"></span>
          <button id="notes-preview-toggle" aria-pressed="false" title="Show the Markdown preview">Preview</button>
          <button id="notes-delete" class="danger">Delete</button>
        </div>
        <div class="notes-edit">
          <textarea id="notes" placeholder="Private notes — encrypted on this device, and hidden from screen capture.&#10;&#10;Markdown works: # heading, **bold**, *italic*, - list, `code`"></textarea>
          <div id="notes-preview" hidden></div>
        </div>
        <div class="notes-foot" id="notes-status">Opening notes…</div>
      </section>
    </div>

    <dialog id="notes-dialog" aria-labelledby="nd-title">
      <h3 id="nd-title">Export notes</h3>
      <p id="nd-sub"></p>
      <fieldset id="nd-kind">
        <label><input type="radio" name="nd-kind" value="pwnotes" checked>
          <span><b>Encrypted</b> (.pwnotes): needs the password, opens on any PC</span></label>
        <label><input type="radio" name="nd-kind" value="txt">
          <span><b>Plain text</b> (.txt): <span class="warn">not encrypted</span></span></label>
      </fieldset>
      <label class="nd-field" id="nd-pass-row">Password
        <input type="password" id="nd-pass" autocomplete="off" spellcheck="false"></label>
      <label class="nd-field" id="nd-confirm-row">Confirm password
        <input type="password" id="nd-confirm" autocomplete="off" spellcheck="false"></label>
      <p id="nd-error" role="alert"></p>
      <div class="nd-actions">
        <button id="nd-cancel" type="button">Cancel</button>
        <button id="nd-ok" type="button" class="primary">Export</button>
      </div>
    </dialog>
  </div>

<script src="renderer/notices.js"></script>
<script src="renderer/rich-text.js"></script>
<script src="renderer/notes-model.js"></script>
<script src="renderer/markdown.js"></script>
<script src="renderer/notes-ui.js"></script>
<script src="renderer/shortcuts.js"></script>
<script src="renderer/tabs.js"></script>
<script src="renderer/bookmarks.js"></script>
<script src="renderer/adblock-ui.js"></script>
<script src="renderer/app.js"></script>
</body>
</html>
